<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set a new password</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body.update-password-page {
      margin: 0;
      font-family: 'Manrope', sans-serif;
      background-color: #f7f4f1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }

    .update-password-page .reset-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .update-password-page .reset-logo img {
      width: 48px;
      height: auto;
      opacity: 0.95;
      display: block;
    }

    .update-password-page .container {
      background: #ffffff;
      padding: 32px 32px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.04);
      box-sizing: border-box;
    }

    .update-password-page h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.45rem;
      line-height: 1.25;
      text-align: center;
      margin-bottom: 22px;
      color: #2d1b12;
    }

    .update-password-page label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #3a2a22;
    }

    .update-password-page input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border-radius: 10px;
      border: 1px solid #d8cfc7;
      background: #f7f4f1;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 64px;
      margin-bottom: 18px;
    }

    .password-strength {
      font-size: 0.85rem;
      margin-top: -10px;
      margin-bottom: 14px;
      color: #777;
      min-height: 1.2em;
    }

    .password-strength.weak {
      color: #b71c1c;
    }

    .password-strength.moderate {
      color: #f57c00;
    }

    .password-strength.strong {
      color: #2e7d32;
    }

    .update-password-page input:focus {
      outline: none;
      border-color: #2A9D8F;
      background: #ffffff;
    }

    .update-password-page #update-password-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 999px;
      background-color: #3b1406;
      color: white;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s ease;
      margin-top: 2px;
    }

    .update-password-page #update-password-btn:hover {
      opacity: 0.9;
    }

    .update-password-page #update-password-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .update-password-page #message {
      margin-top: 14px;
      font-size: 0.9rem;
      text-align: center;
      color: #444;
    }

    .success-message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(34, 139, 34, 0.08);
      color: #2e7d32;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkmark {
      font-size: 1.1rem;
    }
  </style>
</head>
<body class="update-password-page">

  <div class="container">
    <div class="reset-logo">
      <img src="/images/CK%20Van%20Drizzle%20Logo%20.png" alt="Karuna Counselling logo">
    </div>
    <h1>Set a new password</h1>

    <label for="new-password">New password</label>
    <div class="password-wrapper">
      <input type="password" id="new-password" placeholder="New password" minlength="10" autocomplete="new-password" />
      <button type="button" id="togglePassword">Show</button>
    </div>
    <div id="password-strength" class="password-strength" aria-live="polite"></div>
    <ul id="passwordChecklist" class="password-checklist">
      <li id="check-length">At least 10 characters</li>
      <li id="check-lower">Lowercase letter</li>
      <li id="check-upper">Uppercase letter</li>
      <li id="check-number">Number</li>
      <li id="check-symbol">Symbol</li>
    </ul>

    <label for="confirm-password">Confirm password</label>
    <div class="password-wrapper">
      <input type="password" id="confirm-password" placeholder="Confirm password" minlength="10" autocomplete="new-password" />
      <button type="button" id="toggleConfirmPassword">Show</button>
    </div>

    <button id="update-password-btn">Update password</button>

    <p id="message"></p>
    <div id="successMessage" class="success-message" style="display: none;">
      <span class="checkmark">✔</span>
      Your password has been updated successfully.
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>

  <script type="module">
    import { supabase } from './js/supabaseClient.js';
    /* passwordUtils: validatePassword, getPasswordStrength, getPasswordChecklist (+ UI helpers below) */
    import {
      validatePassword,
      syncPasswordStrengthElement,
      syncPasswordChecklistUI,
      showPasswordMinLengthSubmitError
    } from './js/passwordUtils.js';

    const btn = document.getElementById('update-password-btn');
    const message = document.getElementById('message');
    const successMessage = document.getElementById('successMessage');
    const passwordInput = document.getElementById('new-password');
    const strengthEl = document.getElementById('password-strength');
    const togglePassword = document.getElementById('togglePassword');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');

    if (togglePassword && passwordInput) {
      togglePassword.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          togglePassword.textContent = 'Hide';
        } else {
          passwordInput.type = 'password';
          togglePassword.textContent = 'Show';
        }
      });
    }

    if (toggleConfirmPassword && confirmPasswordInput) {
      toggleConfirmPassword.addEventListener('click', () => {
        if (confirmPasswordInput.type === 'password') {
          confirmPasswordInput.type = 'text';
          toggleConfirmPassword.textContent = 'Hide';
        } else {
          confirmPasswordInput.type = 'password';
          toggleConfirmPassword.textContent = 'Show';
        }
      });
    }

    passwordInput.addEventListener('input', () => {
      const v = passwordInput.value;
      syncPasswordStrengthElement(v, strengthEl);
      syncPasswordChecklistUI(v);
    });

    let hasSession = false;

    (async () => {
      try {
        if (!supabase) throw new Error('Supabase not configured');
        const { data } = await supabase.auth.getSession();

        if (data?.session) {
          hasSession = true;
        } else {
          message.textContent = 'Invalid or expired reset link.';
          btn.disabled = true;
        }
      } catch (e) {
        message.textContent = 'Invalid or expired reset link.';
        btn.disabled = true;
      }
    })();

    btn.addEventListener('click', async () => {
      if (!hasSession) return;

      const password = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;

      message.textContent = '';

      if (!validatePassword(password)) {
        showPasswordMinLengthSubmitError(strengthEl);
        return;
      }

      if (password !== confirm) {
        message.textContent = 'Passwords do not match';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating...';
      message.textContent = '';
      successMessage.style.display = 'none';

      try {
        const { error } = await supabase.auth.updateUser({
          password: password
        });

        if (error) throw error;
        successMessage.style.display = 'flex';

        message.textContent = 'Password updated. Redirecting to login...';

        setTimeout(() => {
          window.location.href = '/index.html#login';
        }, 2000);

      } catch (err) {
        message.textContent = 'Reset link expired or invalid.';
      }

      btn.disabled = false;
      btn.textContent = 'Update password';
    });
  </script>
  <script src="/js/pwa-install.js" defer></script>
</body>
</html>
